<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H · Real scope (PROTOTYPE)</title>
<!-- PROTOTYPE, throwaway. Preview G redrawn at the scope the build will have, after the six-reviewer
     brainstorm of 2026-11-10 (concepts_brief.md). Open with ?l=en, ?l=ar or ?l=he.
     What changed from G: the real header; résumé and WhatsApp in the first screen; answers in three languages
     that never claim something was sent; the zoom only on a tap or the visitor's own scroll; one strip under
     the answer instead of four screens; cards that land face up and open a sheet the Back button closes;
     services, process and the contact form kept as visible text with the ids the header links to.
     Copy, links and statuses come from scope-data.js, generated from src/content. The new lines in T below
     are drafts: the Arabic and Hebrew need the owner's read.
     Limit of a static preview: everything here is drawn by script. The build renders it on the server. -->
<link rel="stylesheet" href="shared.css">
<style>
:root{--head:64px}
html{scroll-padding-top:calc(var(--head) + 12px)}
[lang=en]{font-family:"Schibsted Grotesk",system-ui,sans-serif}
a{color:inherit}

/* the site's header, as it is today: brand, four section links, language switch, one action */
.head{position:sticky;z-index:30;top:0;display:flex;align-items:center;gap:20px;height:var(--head);padding:0 var(--gut);background:var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;text-decoration:none}
.brand span{width:44px;color:var(--acid)}
.head nav{display:flex;gap:4px;margin-inline-start:auto}
.head nav a,.lng a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:999px;font-size:15px;font-weight:600;text-decoration:none;color:var(--soft-dark)}
.lng{display:flex}
.lng a[aria-current]{color:var(--paper);background:var(--ink-3)}
.head .btn{min-height:44px;padding:0 20px;font-size:15px}
.menu{display:none;width:44px;height:44px;border:0;border-radius:50%;background:var(--ink-3);color:var(--paper);cursor:pointer}
.menu::before{content:"";display:block;width:18px;height:8px;margin:auto;border-block:2px solid currentColor}

/* 1. first screen: the card table (F) with the folded sheet on it (C). Ordinary flow; it may be taller than the screen */
.table0{position:relative;display:grid;place-items:center;min-height:calc(100svh - var(--head) - var(--bar));padding:clamp(104px,15vh,150px) var(--gut);overflow:hidden}
.felt{position:absolute;inset:0;perspective:1400px}
.felt li{position:absolute;left:var(--x);top:var(--y);width:clamp(96px,10vw,150px);aspect-ratio:5/7;rotate:var(--r);border-radius:12px;overflow:hidden;animation:deal .6s var(--ease) both;animation-delay:calc(var(--n)*70ms + .2s)}
@keyframes deal{from{opacity:0;transform:translate(40%,-60%) rotate(14deg) scale(.9)}to{opacity:1;transform:none}}
.fold{position:relative;z-index:1;display:grid;grid-template-columns:1fr 96px 1fr;width:min(1180px,100%);perspective:1800px}
.leaf{display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0;padding:clamp(22px,3vw,40px);color:var(--ink);animation:rise .8s var(--ease) both}
.leaf.main{border-radius:28px 6px 6px 28px;background:var(--paper);transform-origin:right center;transform:rotateY(4deg)}
.leaf.other{border-radius:6px 28px 28px 6px;background:var(--acid);transform-origin:left center;transform:rotateY(-4deg)}
[dir=rtl] .leaf.main{border-radius:6px 28px 28px 6px;transform-origin:left center;transform:rotateY(-4deg)}
[dir=rtl] .leaf.other{border-radius:28px 6px 6px 28px;transform-origin:right center;transform:rotateY(4deg)}
.spine{display:grid;place-items:center;color:var(--acid)}
.spine span{width:72px}
.who{font-size:15px;font-weight:600}
.display[lang=en]{font-size:clamp(30px,3.6vw,52px)}
.display[lang=ar]{font-size:clamp(34px,4.2vw,62px);line-height:1.18}
.display[lang=he]{font-size:clamp(28px,3.3vw,48px);line-height:1.1}
.leaf.other .display{font-size:clamp(26px,3vw,44px)}
.leaf .lead{font-size:clamp(16px,1.5vw,19px)}
.ask{display:flex;flex-direction:column;gap:10px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.write{display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--ink)}
.write input{flex:1;min-width:0;height:48px;padding:0 16px;border:0;border-radius:999px;background:none;color:var(--paper);font-weight:600}
.write input::placeholder{color:var(--soft-dark)}
.write .btn{min-height:48px}
.doors{display:flex;flex-wrap:wrap;gap:8px}
.doors .btn{flex:1 1 150px;text-decoration:none}

/* the answer, in place: the reply, what to do next, and the route the question took */
.log{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.log:empty{display:none}
.log .bub{padding:10px 16px;font-size:17px}
.log .bub.cust{background:var(--acid)}
.log .bub.agent{background:var(--ink);color:var(--paper);max-width:100%}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{min-height:44px;padding:0 18px;font-size:15px;text-decoration:none}
.acts .chip{background:var(--paper-2);color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.strip li{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--paper-2);animation:rise .5s var(--ease) both;animation-delay:calc(var(--n)*90ms)}
.strip span{font-size:13px;color:var(--soft-light)}
.strip b{font-size:15px;font-weight:600;line-height:1.25}

/* 2. the opening (D): only this is pinned. The mark, large; scroll or tap "See it" and its eye opens */
.open{position:relative;height:260svh}
.stage{position:sticky;top:var(--head);height:calc(100svh - var(--head) - var(--bar));overflow:hidden}
.stage>img,.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage>img{object-fit:cover;object-position:top}
.cap{position:absolute;inset:auto var(--gut) 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;opacity:0}
.cap b{padding:12px 20px;border-radius:999px;background:var(--ink);font-weight:600}

/* 3. the work: dealt face down, landing face up */
.work{display:flex;flex-direction:column;gap:20px;padding:96px var(--gut)}
.work .lead{color:var(--soft-dark)}
.calls{display:flex;flex-wrap:wrap;gap:8px}
.calls [aria-pressed=true]{background:var(--paper);color:var(--ink)}
.calls .dealb{background:var(--acid);color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(8px,1.4vw,18px);perspective:1400px;max-width:1100px}
.cards li{rotate:var(--tilt);opacity:0}
.work.in .cards li{animation:deal .5s var(--ease) both;animation-delay:calc(var(--n)*40ms)}
.cardb{display:block;width:100%;aspect-ratio:5/7;border:0;padding:0;background:none;cursor:pointer}
.cardb .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s var(--io)}
.cardb[aria-pressed=true] .in{transform:rotateY(180deg)}
.cardb:active .in{scale:.97}
.back,.front{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden}
.back,.felt .down{display:grid;place-items:center;background:var(--acid);color:var(--ink)}
.back span,.felt .down span{width:54%}
.front,.felt .up{display:flex;flex-direction:column;background:var(--ink-2);color:var(--paper)}
.front{transform:rotateY(180deg)}
.front img,.felt .up img{flex:1;min-height:0;width:100%;object-fit:cover;object-position:top}
.tx{display:flex;flex-direction:column;gap:2px;padding:8px 10px 10px;text-align:start}
.tx b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:clamp(13px,1.1vw,15px);font-weight:600;line-height:1.2}
.tx small{font-size:12px;line-height:1.2;color:var(--soft-dark)}
.tx em{display:none;font-style:normal;font-size:12px;line-height:1.25}
.felt li>div{width:100%;height:100%}
/* the card look the owner chose on 2026-11-11: the phone capture fills most of the card, the name sits above it, large, on a colour */
.c4 .cardb,.c4 .felt li{aspect-ratio:10/17}
.c4 .back,.c4 .front,.c4 .felt li{border-radius:clamp(14px,1.6vw,22px)}
.c4 img.wide{display:none}
.c4 .tx{order:-1;flex:none;gap:4px;padding:clamp(9px,1vw,13px) clamp(9px,1vw,13px) 8px}
.c4 .tx b{font-size:clamp(15px,1.4vw,20px);font-weight:800;letter-spacing:-.04em;line-height:1.02;-webkit-line-clamp:3}
.c4 .tx small{order:-1;color:inherit;opacity:.7}
/* the capture sits in the eye of the ف: three round corners and one square */
.c4 img.tall{margin:0 6px 6px;width:auto;border-radius:clamp(10px,1.3vw,18px) clamp(10px,1.3vw,18px) 3px clamp(10px,1.3vw,18px)}
[dir=rtl] .c4 img.tall{border-radius:clamp(10px,1.3vw,18px) clamp(10px,1.3vw,18px) clamp(10px,1.3vw,18px) 3px}
.c4 .cards li:nth-child(3n+1) .front,.c4 .felt li:nth-child(odd) .up{background:var(--paper);color:var(--ink)}
.c4 .cards li:nth-child(3n) .front{background:var(--acid);color:var(--ink)}

/* a card opens from where it was touched, onto a sheet that turns on its spine between languages */
dialog{width:100vw;max-width:none;height:100svh;max-height:none;margin:0;border:0;padding:0 var(--gut) 40px;background:var(--paper);color:var(--ink);overflow-y:auto}
dialog::backdrop{background:none}
.bar{position:sticky;z-index:1;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0;background:var(--paper)}
.langs{display:flex;gap:6px}
.langs button{min-height:48px;padding:0 16px;border:0;border-radius:999px;background:var(--paper-2);color:var(--ink);font-weight:600;cursor:pointer}
.langs [aria-pressed=true]{background:var(--ink);color:var(--paper)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;min-height:calc(100svh - 136px);perspective:1600px}
.sheet{display:flex;align-items:flex-start;gap:clamp(20px,3vw,40px);padding:clamp(16px,2.4vw,28px);border-radius:28px;background:var(--ink);color:var(--paper)}
.sheet>.live{flex:none;width:46%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:16px}
.sheet>div{min-width:0}
.sheet h3{font-size:clamp(28px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.sheet .cat{margin:8px 0 4px;font-weight:600;color:var(--acid)}
.sheet .st{font-size:15px;color:var(--soft-dark)}
.sheet .sum{margin-top:14px;color:var(--soft-dark);max-width:34em}
.sheet .acts{margin-top:20px}
.sheet .acts .btn.ink{background:var(--ink-3)}
.sheet .acts .btn{min-height:48px;padding-block:10px;border-radius:24px;white-space:normal;text-align:center}
.sheet .note{margin-top:12px;font-size:14px;color:var(--soft-dark)}
/* SOLitaire, live: the frame is laid out at its own size and scaled to fit, over the still, and shown only once
   the page says it is ready, as src/components/live-embed.tsx does on the site */
.live{position:relative;display:block;overflow:hidden;border-radius:16px;background:var(--ink-3)}
.live img{width:100%;height:100%;object-fit:cover;object-position:top}
.live iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;opacity:0;transition:opacity .3s var(--ease)}
.live[data-ready] iframe{opacity:1}
.live small{position:absolute;inset:auto auto 10px 10px;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--acid);font-size:13px;font-weight:600}
.sheet>.live{flex:none;width:46%;aspect-ratio:1280/800}
.play{display:grid;justify-items:start;gap:10px;margin-top:22px}
.play[hidden]{display:none}
.play b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.play .live{width:min(100%,300px);aspect-ratio:393/874}
.demo{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:22px;padding:16px;border-radius:20px;background:var(--ink-2)}
.demo[hidden]{display:none}
.demo .dlog{display:flex;flex-direction:column;gap:8px}
.demo .bub{padding:10px 16px;font-size:16px}
.demo small{font-size:14px;color:var(--soft-dark)}
.demo .write{background:var(--ink-3)}

/* 4. services and process stay on the page as plain text, laid out as a thread (B). The header links here */
.thread{display:grid;gap:56px;padding:96px var(--gut);background:var(--paper);color:var(--ink)}
.thread>div{display:flex;flex-direction:column;align-items:flex-start;gap:10px;max-width:880px}
.thread h2.bub{font-size:clamp(26px,3.6vw,44px);font-weight:800;letter-spacing:-.04em;line-height:1.1;max-width:none;background:var(--ink);color:var(--paper);align-self:flex-end;padding:16px 24px}
.thread .bub.agent{max-width:44ch;font-size:17px;font-weight:400}
.thread .bub b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.thread .tags{font-size:14px;color:var(--soft-light);margin-top:4px;display:block}

/* 5. the end: every way to reach him */
.contact{display:grid;grid-template-columns:1fr minmax(0,460px);gap:40px;padding:96px var(--gut);background:var(--acid);color:var(--ink)}
.contact .lead{margin-top:20px}
.contact form{display:grid;gap:10px}
.contact label{font-size:15px;font-weight:600}
.contact input,.contact textarea{width:100%;min-height:52px;padding:14px 18px;border:0;border-radius:18px;background:var(--paper);color:var(--ink);font:inherit}
.contact textarea{min-height:120px;resize:vertical}
.contact .ways{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.contact .ways .btn{text-decoration:none}
.foot{padding:28px var(--gut);color:var(--soft-dark);font-size:15px}

.still .open{height:auto}.still .stage{position:relative;top:0;height:auto}.still canvas{display:none}
.still .stage>img{position:static;height:60svh}.still .cap{position:static;opacity:1;padding:16px var(--gut)}
.still .cards li{opacity:1}

@media (max-width:900px){
  .head nav{display:none;position:absolute;inset:var(--head) 0 auto;flex-direction:column;margin:0;padding:8px var(--gut) 16px;background:var(--ink)}
  .head nav.on{display:flex}
  .head .btn{display:none}
  .brand b{display:none}
  .lng{margin-inline-start:auto}
  .menu{display:block}
  .contact{grid-template-columns:1fr}
}
@media (max-width:760px){
  .table0{padding:88px 12px 104px}
  .felt li{left:var(--mx);top:var(--my)}
  .fold{grid-template-columns:1fr;grid-template-rows:auto 56px auto}
  .leaf{gap:14px;padding:20px}
  .leaf.main,[dir=rtl] .leaf.main{border-radius:24px 24px 6px 6px;transform:none}
  .leaf.other,[dir=rtl] .leaf.other{border-radius:6px 6px 24px 24px;transform:none}
  .spine span{width:56px}
  .strip{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:repeat(3,1fr)}
  .c4 .cards{grid-template-columns:repeat(2,1fr)}
  .sheet{flex-direction:column;align-items:stretch}
  .sheet>img,.sheet>.live{width:100%}
  .langs button{padding:0 14px}
}
@media (max-width:380px){.langs{gap:4px}.langs button{padding:0 10px}.bar .btn{min-height:48px;padding:0 16px}}
</style>
</head>
<body id="top" class="c4">
<header class="head" id="head"></header>
<main>
  <section class="table0">
    <ul class="felt" id="felt" aria-hidden="true"></ul>
    <div class="fold">
      <div class="leaf main" id="main"></div>
      <div class="spine"><span data-mark></span></div>
      <div class="leaf other" id="other"></div>
    </div>
  </section>

  <section class="open" id="open">
    <div class="stage">
      <img id="through" src="../../../../public/work/elsewhereco/desktop.webp" alt="">
      <canvas aria-hidden="true"></canvas>
      <p class="cap" id="cap"><b id="capt"></b><button class="btn" id="capb"></button></p>
    </div>
  </section>

  <section class="work" id="work">
    <h2 class="display" id="wt"></h2>
    <p class="lead" id="wl"></p>
    <div class="calls" id="calls"></div>
    <ul class="cards" id="cards"></ul>
  </section>

  <section class="thread" id="thread"></section>
  <section class="contact" id="contact"></section>
  <footer class="foot" id="foot"></footer>
</main>

<dialog id="dlg" aria-labelledby="dt">
  <div class="bar">
    <div class="langs" role="group" aria-label="Language">
      <button data-l="en" lang="en">English</button>
      <button data-l="ar" lang="ar">العربية</button>
      <button data-l="he" lang="he">עברית</button>
    </div>
    <button class="btn ink" id="dx"></button>
  </div>
  <div class="wrap">
    <article class="sheet" id="sheet">
      <span class="live" id="shot"><img id="di" src="../../../../public/work/elsewhereco/desktop.webp" alt=""></span>
      <div>
        <h3 id="dt" dir="auto"></h3>
        <p class="cat" id="dc"></p>
        <p class="st" id="dst"></p>
        <p class="sum" id="ds"></p>
        <div class="acts" id="da"></div>
        <p class="note" id="dn"></p>
        <div class="play" id="play" hidden><b id="pt"></b><span class="live" id="table"><img src="../../../../public/labs/solitaire/solitaire-suit-table-live-mobile.jpg" alt=""></span></div>
        <div class="demo" id="demo" hidden>
          <p id="dmi"></p>
          <div class="dlog" id="dlog" aria-live="polite"></div>
          <div class="chips" id="dchips"></div>
          <form class="write" id="dform"><label class="vh" for="dq">Customer message</label><input id="dq" dir="auto" autocomplete="off"><button class="btn" id="dsend"></button></form>
          <small id="dmn"></small>
        </div>
      </div>
    </article>
  </div>
</dialog>
<script src="shared.js"></script>
<script src="scope-data.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.body.classList.add(reduce ? 'still' : 'moving');
const LOCS = ['en', 'ar', 'he'], NAME = { en: 'English', ar: 'العربية', he: 'עברית' };
const L = LOCS.find(l => l === new URLSearchParams(location.search).get('l')) ?? 'en';
const D = SITE.ui[L], CARDS = SITE.cards, t = o => o[L];
document.documentElement.lang = L; document.documentElement.dir = L === 'en' ? 'ltr' : 'rtl';
const bySlug = s => CARDS.find(c => c.slug === s);
const live = CARDS.filter(c => c.status === 'live-product'), apks = CARDS.filter(c => c.apks.length);
const way = k => SITE.profile.contactLinks.find(c => c.kind === k);
const local = href => href.startsWith('/') ? PUB + href : href; // files under public/ open from the repo in this preview
const casePage = (c, l) => `https://fhaj.dev${l === 'en' ? '' : '/' + l}/work/${c.slug}`;
// one face for the cards on the table and the cards in the work section; each look shows the capture that suits its shape
const face = c => `<img class="tall" src="${PUB + c.tall}" alt=""><img class="wide" src="${PUB + (c.wide ?? c.tall)}" alt=""><span class="tx"><b><bdi>${c.title}</bdi></b><small>${t(SITE.status[c.status])}</small><em>${t(c.cat)}</em></span>`;
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/* New copy written for this preview. Everything else comes from the site. Drafts: the Arabic and Hebrew need the owner's read. */
const T = {
  head: { en: 'I build what answers<br>your customers.', ar: 'أبني ما يردّ على زبائنك.', he: 'אני בונה את מה שעונה ללקוחות שלכם.' },
  ask: { en: 'Ask about the work', ar: 'اسأل عن الأعمال', he: 'שאלו על העבודות' },
  q: {
    live: { en: "What's live?", ar: 'ما الذي يعمل الآن؟', he: 'מה באוויר?' },
    install: { en: 'What can I install?', ar: 'ماذا يمكنني أن أثبّت؟', he: 'מה אפשר להתקין?' },
    services: { en: 'What do you build?', ar: 'ماذا تبني؟', he: 'מה אתה בונה?' },
    process: { en: 'How do you work?', ar: 'كيف تعمل؟', he: 'איך אתה עובד?' },
    demo: { en: 'Try the shop agent', ar: 'جرّب وكيل المتجر', he: 'נסו את סוכן החנות' },
    play: { en: 'Play SOLitaire', ar: 'العب SOLitaire', he: 'שחקו SOLitaire' },
  },
  live: n => ({ en: `${n} products are live. Tap one to open it.`, ar: `${n} منتجات تعمل الآن. اضغط على أيٍّ منها لفتحه.`, he: `${n} מוצרים באוויר. הקישו על אחד כדי לפתוח אותו.` }),
  install: n => ({ en: `${n} Android builds you can install.`, ar: `${n} نسخ أندرويد يمكنك تثبيتها.`, he: `${n} גרסאות אנדרואיד שאפשר להתקין.` }),
  resume: { en: 'Here it is.', ar: 'تفضّل.', he: 'בבקשה.' },
  none: { en: "I don't have an approved answer for that. Send it to Fathallah on WhatsApp and he will answer himself.", ar: 'ليس لديّ جواب معتمد على هذا. أرسله إلى فتحلله على واتساب وسيجيبك بنفسه.', he: 'אין לי תשובה מאושרת לזה. שלחו את זה לפתאללה ב-WhatsApp והוא יענה בעצמו.' },
