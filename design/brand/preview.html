<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Fathallah Haj - Logo Proof</title>
  <link rel="icon" href="../../public/brand/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; background: #f7f7f4; color: #0b0b0b; font-family: Arial, sans-serif; }
    a { color: #1947e5; text-underline-offset: 4px; }
    .page-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 16px; max-width: 1280px; margin: auto; padding: 24px; }
    h1 { margin: 0; font-size: 22px; font-weight: 600; }
    h2 { margin: 0 0 24px; font-size: 18px; font-weight: 600; }
    .page-head p { margin: 0; color: #55554f; font-size: 13px; }
    .specimen { display: grid; grid-template-columns: 1.25fr 1fr 1fr; border-block: 1px solid #d1d1ca; }
    .specimen figure { display: flex; min-width: 0; margin: 0; padding: 40px 24px 24px; min-height: 350px; align-items: center; justify-content: space-between; flex-direction: column; gap: 24px; }
    .specimen img { width: min(100%, 300px); height: 220px; object-fit: contain; }
    .specimen figcaption { font-size: 13px; }
    .dark { background: #0b0b0b; color: #fff; }
    .acid { background: #c8ff34; color: #0b0b0b; }
    .section { padding: 32px 24px; max-width: 1280px; margin: auto; }
    .sizes { display: flex; flex-wrap: wrap; gap: 32px; }
    .sizes figure { display: grid; width: 80px; margin: 0; justify-items: center; align-items: center; grid-template-rows: 72px 24px; font-size: 12px; }
    .sizes img { display: block; }
    .browser-tabs { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 24px; }
    .browser-tab { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border: 1px solid #b5b5ad; border-radius: 6px 6px 0 0; font-size: 12px; }
    .browser-tab img { width: 16px; height: 16px; }
    .browser-tab.dark { border-color: #0b0b0b; }
    .header-proof { border-top: 1px solid #d1d1ca; }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 24px; min-height: 76px; }
    .identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .identity img { flex: 0 0 58px; width: 58px; height: 43px; object-fit: contain; }
    .identity strong { display: block; font-size: 14px; white-space: nowrap; }
    .identity small { display: block; font-size: 10px; margin-top: 4px; opacity: .8; }
    .navigation { display: flex; gap: 24px; align-items: center; font-size: 13px; }
    .languages { display: flex; font-size: 11px; gap: 10px; flex-shrink: 0; }
    .mobile-proofs { display: flex; flex-wrap: wrap; align-items: start; gap: 32px; }
    .mobile-proof { margin: 0; max-width: 100%; }
    .mobile-proof figcaption { font-size: 12px; margin-bottom: 12px; }
    .mobile-proof .header-row { width: 390px; max-width: 100%; gap: 10px; padding: 12px 16px; }
    .mobile-proof.narrow .header-row { width: 360px; }
    .mobile-proof .identity { gap: 9px; }
    .mobile-proof .identity img { flex-basis: 48px; width: 48px; height: 36px; }
    .mobile-proof .identity strong { font-size: 13px; }
    .mobile-proof .identity small { font-size: 9px; }
    .mobile-proof .languages { gap: 7px; font-size: 10px; }
    .pixel-proof { display: block; width: 100%; max-width: 1144px; height: auto; }
    .downloads { display: flex; flex-wrap: wrap; gap: 16px 28px; font-size: 14px; }
    @media (max-width: 700px) {
      .specimen { grid-template-columns: 1fr; }
      .specimen figure { min-height: 280px; padding: 24px; }
      .specimen img { height: 190px; }
      .navigation { display: none; }
      .header-row { padding: 12px 16px; }
      .sizes { gap: 20px; }
    }
  </style>
</head>
<body>
  <header class="page-head"><h1>Fathallah Haj</h1><p>Counterform / Vector Proof</p></header>
  <main>
    <section class="specimen" aria-label="Monogram color proofs">
      <figure><img src="../../public/brand/fh-monogram.svg" width="750" height="550" alt="Fathallah Haj monogram in black"><figcaption>Black / Transparent</figcaption></figure>
      <figure class="dark"><img src="../../public/brand/fh-monogram-white.svg" width="750" height="550" alt="Fathallah Haj monogram in white"><figcaption>White / Near-black</figcaption></figure>
      <figure class="acid"><img src="../../public/brand/fh-monogram.svg" width="750" height="550" alt="Fathallah Haj monogram on green"><figcaption>Black / Acid Green</figcaption></figure>
    </section>
    <section class="section">
      <h2>Actual-size Icons</h2>
      <div class="sizes">
        <figure><img src="../../public/brand/favicon-16.png" width="16" height="16" alt="16 pixel favicon"><figcaption>16 px</figcaption></figure>
        <figure><img src="../../public/brand/favicon-24.png" width="24" height="24" alt="24 pixel favicon"><figcaption>24 px</figcaption></figure>
        <figure><img src="../../public/brand/favicon-32.png" width="32" height="32" alt="32 pixel favicon"><figcaption>32 px</figcaption></figure>
        <figure><img src="../../public/brand/favicon-48.png" width="48" height="48" alt="48 pixel favicon"><figcaption>48 px</figcaption></figure>
        <figure><img src="../../public/brand/favicon-64.png" width="64" height="64" alt="64 pixel favicon"><figcaption>64 px</figcaption></figure>
      </div>
      <div class="browser-tabs">
        <div class="browser-tab"><img src="../../public/brand/favicon-16.png" width="16" height="16" alt="">Fathallah Haj</div>
        <div class="browser-tab dark"><img src="../../public/brand/favicon-16.png" width="16" height="16" alt="">Fathallah Haj</div>
      </div>
    </section>
    <section class="header-proof" aria-label="Desktop header proof">
      <div class="header-row dark">
        <div class="identity"><img src="../../public/brand/fh-monogram-acid.svg" width="58" height="43" alt="Fathallah Haj monogram"><div><strong>Fathallah Haj</strong><small>Product / AI / DevOps</small></div></div>
        <div class="navigation"><span>Services</span><span>Work</span><span>Process</span><span>Contact</span></div>
        <div class="languages"><span>EN</span><span lang="ar">ع</span><span lang="he">ע</span></div>
      </div>
    </section>
    <section class="section">
      <h2>Compact Headers</h2>
      <div class="mobile-proofs">
        <figure class="mobile-proof">
          <figcaption>EN / 390 px</figcaption>
          <div class="header-row dark">
            <div class="identity"><img src="../../public/brand/fh-monogram-acid.svg" width="48" height="36" alt="Fathallah Haj monogram"><div><strong>Fathallah Haj</strong><small>Product / AI / DevOps</small></div></div>
            <div class="languages"><span>EN</span><span lang="ar">ع</span><span lang="he">ע</span></div>
          </div>
        </figure>
        <figure class="mobile-proof narrow">
          <figcaption>AR / 360 px</figcaption>
          <div class="header-row dark" dir="rtl" lang="ar">
            <div class="identity"><img src="../../public/brand/fh-monogram-acid.svg" width="48" height="36" alt="Fathallah Haj"><div dir="ltr"><strong>Fathallah Haj</strong><small>Product / AI / DevOps</small></div></div>
            <div class="languages"><span lang="en">EN</span><span>ع</span><span lang="he">ע</span></div>
          </div>
        </figure>
      </div>
    </section>
    <section class="section">
      <h2>Pixel Proof / 16, 24, 32, 48, 64 px</h2>
      <img class="pixel-proof" src="../../tmp/brand/favicon-pixels.png" width="1144" height="348" alt="Native-size favicons and nearest-neighbor enlargements of their pixels">
    </section>
    <section class="section">
      <h2>Assets</h2>
      <div class="downloads">
        <a href="../../public/brand/fh-monogram.svg" download>Black SVG</a>
        <a href="../../public/brand/fh-monogram-white.svg" download>White SVG</a>
        <a href="../../public/brand/fh-monogram-acid.svg" download>Acid SVG</a>
        <a href="../../public/brand/favicon.svg" download>Favicon SVG</a>
        <a href="../../public/brand/favicon.ico" download>Favicon ICO</a>
        <a href="../../public/brand/apple-touch-icon.png" download>Apple Touch Icon</a>
      </div>
    </section>
  </main>
</body>
</html>
